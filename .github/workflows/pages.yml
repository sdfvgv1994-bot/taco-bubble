# 把遊戲放上 GitHub Pages：main 有改動就先跑測試，通過才自動更新網站
name: 網站上線

on:
  push:
    branches: [main]
  pull_request:   # 開 PR 時也先跑測試，合併前就知道有沒有問題
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request'   # PR 只跑測試，不上線
    # 排隊只管上線這一步：PR 的測試不會把排隊中的上線擠掉；正在上線的也不會被中斷
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 填上版本號（提交代號）：手機打開看面板上的代號，就知道是不是最新版
      - name: 加上版本號
        run: |
          v="${GITHUB_SHA::7}"
          mkdir -p site && cp index.html site/
          sed -i "s#name=\"app-version\" content=\"dev\"#name=\"app-version\" content=\"$v\"#" site/index.html
          grep -c "content=\"$v\"" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
