<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123b2d" />
    <meta name="app-version" content="dev" />
    <title>泡泡花園・Bubble Garden</title>
    <style>
      :root {
        --garden-color: #174a37;
        color-scheme: dark;
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        background: #071b18;
        color: #f4f2d5;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        --pad: 24px;
        padding: var(--pad);
        padding-left: max(var(--pad), env(safe-area-inset-left));
        padding-right: max(var(--pad), env(safe-area-inset-right));
        padding-bottom: max(var(--pad), env(safe-area-inset-bottom));
        display: grid;
        place-items: center;
        background: #0f2c24;
        background:
          radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--garden-color) 38%, transparent), transparent 58%),
          radial-gradient(circle at 12% 88%, color-mix(in srgb, var(--garden-color) 30%, transparent), transparent 32%),
          linear-gradient(155deg, color-mix(in srgb, var(--garden-color) 42%, #102b25), #071714 78%);
      }

      .game {
        width: min(100%, 920px);
        padding: 20px;
        border: 1px solid rgba(200, 235, 174, 0.38);
        border-radius: 24px;
        background: #1b4a37;
        background:
          linear-gradient(145deg, color-mix(in srgb, var(--garden-color) 80%, #285b3b), color-mix(in srgb, var(--garden-color) 72%, #0f362b));
        box-shadow:
          0 28px 90px rgba(0, 0, 0, 0.45),
          0 0 35px rgba(113, 221, 148, 0.1),
          inset 0 1px rgba(255, 255, 255, 0.12);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .flower-mark {
        font-size: 2.1rem;
        filter: drop-shadow(0 3px 8px rgba(255, 221, 151, 0.3));
      }

      h1 {
        margin: 0;
        font-size: clamp(1.45rem, 5vw, 2rem);
        letter-spacing: 0.08em;
        color: #fff4c5;
        text-shadow: 0 3px 18px rgba(255, 222, 139, 0.2);
      }

      .subtitle {
        margin-top: 3px;
        color: #d4ddb1;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.18em;
      }

      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .round-label {
        margin-right: 8px;
        color: #e5e6bd;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      button {
        font: inherit;
      }

      .control-button {
        min-height: 42px;
        padding: 8px 12px;
        border: 1px solid rgba(229, 240, 190, 0.32);
        border-radius: 12px;
        background: rgba(227, 242, 192, 0.1);
        color: #fff7d7;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
        white-space: nowrap;
      }

      .control-button:hover {
        background: rgba(227, 242, 192, 0.2);
      }

      .control-button:focus-visible,
      canvas:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 3px solid #fff2ac;
        outline-offset: 3px;
      }

      .play-area {
        --canvas-h: max(520px, min(78vh, 720px));
        --canvas-h: max(520px, min(78dvh, 720px));
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: 14px;
        align-items: stretch;
      }

      .board {
        max-width: var(--canvas-h);
        margin-inline: auto;
        overflow: hidden;
        border: 1px solid rgba(224, 238, 181, 0.38);
        border-radius: 18px;
        background: #174a37;
        box-shadow: inset 0 0 28px rgba(7, 35, 25, 0.45);
      }

      canvas {
        display: block;
        width: 100%;
        height: var(--canvas-h);
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        cursor: crosshair;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .panel {
        padding: 13px;
        border: 1px solid rgba(221, 239, 185, 0.38);
        border-radius: 15px;
        background: #184735;
        background: linear-gradient(145deg, color-mix(in srgb, var(--garden-color) 77%, #194d36), color-mix(in srgb, var(--garden-color) 72%, #113d2f));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.07);
      }

      .settings-grid {
        display: grid;
        gap: 11px;
      }

      .setting-label {
        display: block;
        margin-bottom: 6px;
        color: #e4e9c9;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .mode-select {
        width: 100%;
        min-height: 38px;
        padding: 7px 9px;
        border: 1px solid rgba(229, 240, 190, 0.34);
        border-radius: 9px;
        background: rgba(8, 31, 24, 0.55);
        color: #fff7d7;
        font: inherit;
        font-size: 0.82rem;
      }

      .mode-select option {
        background: #123b2d;
        color: #fff7d7;
      }

      .color-picker-row {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .color-picker {
        width: 42px;
        height: 34px;
        padding: 2px;
        border: 1px solid rgba(229, 240, 190, 0.4);
        border-radius: 8px;
        background: rgba(8, 31, 24, 0.55);
        cursor: pointer;
      }

      .color-value {
        color: #f0ecc6;
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .challenge-status {
        margin: 9px 0 0;
        padding-top: 8px;
        border-top: 1px solid rgba(225, 240, 190, 0.2);
        color: #ffd45e;
        font-size: 0.78rem;
        font-weight: 800;
      }

      .panel-label {
        margin: 0 0 8px;
        color: #f0ecc6;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.12em;
      }

      .score-value {
        color: #ffd45e;
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        line-height: 1.15;
        text-shadow: 0 2px 12px rgba(255, 186, 62, 0.3);
      }

      .score-note,
      .best-score {
        color: #e3e7c5;
        font-size: 0.75rem;
      }

      .best-score {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        padding-top: 9px;
        border-top: 1px solid rgba(225, 240, 190, 0.2);
      }

      .next-bubble {
        min-height: 34px;
        margin: 2px 0 6px;
        font-size: 1.45rem;
      }

      .panel-copy {
        margin: 0;
        color: #e4e9c9;
        font-size: 0.78rem;
        line-height: 1.65;
      }

      .key {
        display: inline-block;
        min-width: 46px;
        margin-right: 5px;
        padding: 2px 5px;
        border: 1px solid rgba(236, 241, 203, 0.42);
        border-radius: 6px;
        color: #fff2c1;
        font-size: 0.68rem;
        font-weight: 800;
        text-align: center;
      }

      .hud {
        display: none;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        padding: 6px 10px;
        border: 1px solid rgba(224, 238, 181, 0.3);
        border-radius: 12px;
        background: rgba(8, 31, 24, 0.45);
        font-size: 0.78rem;
        color: #e4e9c9;
      }

      .hud strong {
        color: #ffd45e;
        font-size: 1.05rem;
        font-variant-numeric: tabular-nums;
      }

      .hud .hud-status {
        flex: 1;
        min-width: 0;
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #ffd45e;
        font-weight: 700;
      }

      .hud .hud-next {
        font-size: 1.15rem;
        line-height: 1;
      }

      .hint {
        margin: auto 4px 0;
        padding: 5px 2px 0;
        color: #dbe3b8;
        font-size: 0.72rem;
        line-height: 1.6;
      }

      @media (max-width: 680px) {
        body {
          --pad: 12px;
          align-items: start;
        }

        .game {
          padding: 14px;
          border-radius: 19px;
        }

        .play-area {
          grid-template-columns: minmax(0, 1fr);
          --canvas-h: clamp(360px, calc(100vh - 190px), 620px);
          --canvas-h: clamp(360px, calc(100dvh - 190px), 620px);
        }

        .hud {
          display: flex;
        }

        #scorePanel,
        #nextPanel {
          display: none;
        }

        .sidebar {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .hint {
          grid-column: 1 / -1;
        }
      }

      @media (max-width: 480px) {
        .topbar {
          align-items: flex-start;
        }

        .round-label,
        .flower-mark,
        .subtitle {
          display: none;
        }

        body {
          --pad: 8px;
        }

        .game {
          padding: 10px;
        }

        .topbar {
          margin-bottom: 10px;
        }

        .controls {
          gap: 6px;
        }

        .control-button {
          min-height: 38px;
          padding: 7px 9px;
          font-size: 0.78rem;
        }

        .sidebar {
          grid-template-columns: minmax(0, 1fr);
        }

        .hint {
          grid-column: auto;
        }
      }
      /* 手機橫拿（螢幕很矮）：泡泡大小是照寬度算的，又寬又矮會一開局就碰到底線。
         所以遊戲區照螢幕高度縮成直的，分數和設定放在右邊，可以自己捲動。 */
      @media (max-height: 500px) and (orientation: landscape) {
        body {
          --pad: 6px;
          align-items: start;
        }

        .game {
          padding: 8px;
        }

        .topbar {
          margin-bottom: 6px;
        }

        .subtitle,
        .flower-mark,
        .round-label,
        .hud {
          display: none;
        }

        h1 {
          font-size: 1.2rem;
        }

        .play-area {
          grid-template-columns: auto minmax(130px, 220px);
          justify-content: center;
          --canvas-h: max(240px, calc(100vh - 90px));
          --canvas-h: max(240px, calc(100dvh - 90px));
        }

        .board {
          width: min(calc(var(--canvas-h) * 0.8), calc(100vw - 200px));
        }

        .sidebar {
          display: flex;
          flex-direction: column;
          max-height: var(--canvas-h);
          overflow-y: auto;
        }

        #scorePanel,
        #nextPanel {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <header class="topbar">
        <div class="brand">
          <span class="flower-mark" aria-hidden="true">🌸</span>
          <div>
            <h1>泡泡花園</h1>
            <div class="subtitle">BUBBLE GARDEN · 01</div>
          </div>
        </div>
        <div class="controls">
          <button id="musicBtn" class="control-button" type="button" aria-pressed="true">♫ 音樂開</button>
          <button id="pauseBtn" class="control-button" type="button" aria-pressed="false">Ⅱ 暫停</button>
          <span class="round-label" id="roundLabel">ROUND&nbsp; 01</span>
          <button id="restartBtn" class="control-button" type="button" aria-label="重新開始" title="重新開始">⟳</button>
        </div>
      </header>
      <div class="play-area">
        <div class="board-wrap">
        <div class="hud" aria-hidden="true">
          <span>分數 <strong id="hudScore">0000</strong></span>
          <span>最高 <strong id="hudBest">0000</strong></span>
          <span>下一顆 <strong class="hud-next" id="hudNext">●</strong></span>
          <span class="hud-status" id="hudStatus"></span>
        </div>
        <div class="board">
          <canvas id="gameCanvas" aria-label="泡泡花園遊戲區：電腦用滑鼠瞄準點擊發射；手機用手指按住拖曳瞄準，放開發射"></canvas>
        </div>
        </div>
        <aside class="sidebar" aria-live="polite">
          <section class="panel">
            <h2 class="panel-label">GARDEN SETTINGS</h2>
            <div class="settings-grid">
              <div>
                <label class="setting-label" for="modeSelect">關卡類型</label>
                <select class="mode-select" id="modeSelect">
                  <option value="classic">經典花園</option>
                  <option value="campaign">闖關模式・50 關</option>
                  <option value="falling">下降闖關・50 關</option>
                  <option value="timed">限時挑戰・60 秒</option>
                  <option value="shots">限球挑戰・25 顆</option>
                  <option value="descent">下降挑戰・8 秒下降</option>
                </select>
              </div>
              <div>
                <label class="setting-label" for="gardenColor">背景顏色</label>
                <div class="color-picker-row">
                  <input class="color-picker" id="gardenColor" type="color" value="#174a37" aria-label="選擇花園背景顏色" />
                  <span class="color-value" id="colorValue">#174A37</span>
                </div>
              </div>
            </div>
            <p class="challenge-status" id="challengeStatus" aria-live="polite">經典花園・無限制</p>
          </section>
          <section class="panel" id="scorePanel">
            <h2 class="panel-label">YOUR SCORE</h2>
            <div class="score-value" id="score">0000</div>
            <p class="score-note" id="scoreNote">讓相同顏色連成一片</p>
            <div class="best-score"><span>最高紀錄</span><strong id="bestScore">0000</strong></div>
          </section>
          <section class="panel" id="nextPanel">
            <h2 class="panel-label">UP NEXT</h2>
            <div class="next-bubble"><strong id="nextColor">●</strong></div>
            <p class="panel-copy">準備發射<br />下一顆泡泡</p>
          </section>
          <section class="panel">
            <h2 class="panel-label">HOW TO PLAY</h2>
            <p class="panel-copy"><span class="key">滑鼠</span>瞄準方向<br /><span class="key">點擊</span>發射泡泡<br /><span class="key">SPACE</span>快速發射<br /><span class="key">手機</span>按住拖曳瞄準，放開發射；拖到發射台下面放開＝取消</p>
          </section>
          <p class="hint">小提示：清除泡泡上方懸空的泡泡，可以拿到額外分數。<br />版本 <span id="ver">dev</span></p>
        </aside>
      </div>
    </main>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const context = canvas.getContext('2d');
      const scoreElement = document.getElementById('score');
      const scoreNoteElement = document.getElementById('scoreNote');
      const bestScoreElement = document.getElementById('bestScore');
      const nextColorElement = document.getElementById('nextColor');
      const musicButton = document.getElementById('musicBtn');
      const pauseButton = document.getElementById('pauseBtn');
      const restartButton = document.getElementById('restartBtn');
      const modeSelect = document.getElementById('modeSelect');
      const gardenColorInput = document.getElementById('gardenColor');
      const colorValueElement = document.getElementById('colorValue');
      const challengeStatusElement = document.getElementById('challengeStatus');
      const roundLabelElement = document.getElementById('roundLabel');
      const hudScore = document.getElementById('hudScore');
      const hudBest = document.getElementById('hudBest');
      const hudNext = document.getElementById('hudNext');
      const hudStatus = document.getElementById('hudStatus');
      const BEST_KEY = 'bubbleGarden.best';

      let columns = 10;
      const initialRows = 6;
      const maxLevels = 50;
      const modeSettings = {
        classic: { label: '經典花園・無限制' },
        campaign: { label: '闖關模式' },
        falling: { label: '下降闖關', interval: 8 },
        timed: { label: '限時挑戰', seconds: 60 },
        shots: { label: '限球挑戰', shots: 25 },
        descent: { label: '下降挑戰', interval: 8 },
      };
      const maxDropsPerLevel = 8;
      const colors = [
        { fill: '#f05a9d', light: '#ffd3e6' },
        { fill: '#84c4f1', light: '#e1f4ff' },
        { fill: '#f17a54', light: '#ffd3b5' },
        { fill: '#f2bd4d', light: '#fff0b5' },
        { fill: '#83d6a1', light: '#e0ffe7' },
        { fill: '#8b5cf6', light: '#e5d8ff' },
      ];
      const melody = [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880, 698.46, 523.25, 587.33, 698.46, 783.99, 880, 783.99, 698.46, 587.33];

      let width = 0;
      let height = 0;
      let radius = 0;
      let rowGap = 0;
      let board = [];
      let score = 0;
      let bestScore = 0;
      let gameMode = 'classic';
      let currentLevel = 1;
      let levelAdvanceTimer = null;
      let remainingTime = 60;
      let shotsRemaining = 25;
      let descentTimer = modeSettings.descent.interval;
      let dropsThisLevel = 0;
      let gameStarted = false;
      let gameOverReason = '';
      let lastDisplayedTime = 60;
      let lastDisplayedDescent = modeSettings.descent.interval;
      let currentColor = 0;
      let nextColor = 1;
      let projectile = null;
      let boardDropAnimation = null;
      let fallingBubbles = [];
      let aim = { x: 0, y: 0 };
      let gameOver = false;
      let hasWon = false;
      let paused = false;
      let pausedAt = 0;
      let audioContext = null;
      let musicTimer = null;
      let musicStep = 0;
      let musicEnabled = true;
      let lastFrame = 0;
      // 每多一排泡泡從上面降下來，就把奇偶排交換，原本的泡泡才不會整片左右跳半格
      let rowParity = 0;
      // 手機瞄準：手指按住時顯示瞄準線，放開才發射
      let touchAiming = false;
      let touchPointerId = null;
      let aimSet = false;
      // 泡泡還在飛、或整片正在往下降時放開手指：先記著，等可以射了再自動射（不會被吃掉）
      let pendingShot = null;
      try { bestScore = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (error) { bestScore = 0; }

      function isShiftedRow(row) {
        return (row + rowParity) % 2 === 1;
      }

      function saveBest() {
        try { localStorage.setItem(BEST_KEY, String(bestScore)); } catch (error) { /* 無痕模式存不了也照玩 */ }
      }

      // 瀏覽器不支援或擋住音效時就安靜玩，不要讓遊戲當掉
      function ensureAudio() {
        if (!audioContext) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return false;
          try { audioContext = new AudioContextClass(); } catch (error) { return false; }
        }
        if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
        return true;
      }

      function bubbleCenter(row, column) {
        return {
          x: radius + column * radius * 2 + (isShiftedRow(row) ? radius : 0),
          y: radius + row * rowGap,
        };
      }

      function neighbors(row, column) {
        // 蜂巢排列：往右錯半格的那排，上下鄰居是 (欄, 欄+1)；沒錯開的那排是 (欄-1, 欄)。
        // 原版錯開的排往上找成 (欄-1, 欄)，會把沒碰在一起的泡泡當成相連。
        const [left, right] = isShiftedRow(row) ? [column, column + 1] : [column - 1, column];
        return [
          [row, column - 1],
          [row, column + 1],
          [row - 1, left],
          [row - 1, right],
          [row + 1, left],
          [row + 1, right],
        ];
      }

      function resizeCanvas() {
        const bounds = canvas.getBoundingClientRect();
        if (!bounds.width || !bounds.height) return;

        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        width = bounds.width;
        height = bounds.height;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        radius = width / (columns * 2 + 1);
        rowGap = radius * Math.sqrt(3);
        // 一開始瞄準線朝正上方（手機沒有滑鼠移動，原本會指向左上角）
        if (!aimSet) aim = { x: width / 2, y: height * 0.3 };
        draw();
      }

      function playTone(frequency, duration, volume, type = 'sine') {
        if (!audioContext) return;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const now = audioContext.currentTime;

        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(now);
        oscillator.stop(now + duration);
      }

      function startMusic(continueFromCurrentStep = false) {
        if (!musicEnabled || gameOver || paused) return;
        if (musicTimer !== null) return;
        if (!ensureAudio()) return;

        if (!continueFromCurrentStep) musicStep = 0;
        const playStep = () => {
          playTone(melody[musicStep], 0.32, 0.022);
          if (musicStep % 4 === 0) {
            playTone(melody[musicStep] / 2, 0.6, 0.014, 'triangle');
          }
          musicStep = (musicStep + 1) % melody.length;
        };
        playStep();
        musicTimer = window.setInterval(playStep, 340);
      }

      function stopMusic() {
        window.clearInterval(musicTimer);
        musicTimer = null;
      }

      function setMusicButton() {
        musicButton.textContent = musicEnabled ? '♫ 音樂開' : '♫ 音樂關';
        musicButton.setAttribute('aria-pressed', String(musicEnabled));
      }

      function setPaused(nextPaused) {
        if (gameOver || paused === nextPaused) return;
        paused = nextPaused;
        pauseButton.textContent = paused ? '▶ 繼續' : 'Ⅱ 暫停';
        pauseButton.setAttribute('aria-pressed', String(paused));
        if (paused) {
          pausedAt = performance.now();
          pendingShot = null;
          stopMusic();
          if (audioContext?.state === 'running') audioContext.suspend().catch(() => {});
        } else {
          const pausedDuration = performance.now() - pausedAt;
          if (boardDropAnimation) boardDropAnimation.startedAt += pausedDuration;
          fallingBubbles.forEach((bubble) => {
            bubble.startedAt += pausedDuration;
          });
          if (musicEnabled) startMusic(true);
        }
        draw();
      }

      function updateChallengeStatus() {
        const settings = modeSettings[gameMode];
        if (gameMode === 'campaign' || gameMode === 'falling') {
          challengeStatusElement.textContent = hasWon
            ? currentLevel === maxLevels
              ? '50 關全數完成！'
              : `第 ${currentLevel} 關完成・準備第 ${currentLevel + 1} 關`
            : gameMode === 'falling'
              ? dropsThisLevel >= maxDropsPerLevel
                ? `第 ${String(currentLevel).padStart(2, '0')} / ${maxLevels} 關・下降已達上限，清除剩餘泡泡`
                : `第 ${String(currentLevel).padStart(2, '0')} / ${maxLevels} 關・下降 ${dropsThisLevel}/${maxDropsPerLevel} 次・${Math.ceil(descentTimer)} 秒後下降`
              : `${settings.label}・第 ${currentLevel} / ${maxLevels} 關`;
        } else if (gameMode === 'timed') {
          challengeStatusElement.textContent =
            `${settings.label}・剩餘 ${Math.ceil(remainingTime)} 秒`;
        } else if (gameMode === 'shots') {
          challengeStatusElement.textContent =
            `${settings.label}・剩餘 ${shotsRemaining} 顆`;
        } else if (gameMode === 'descent') {
          challengeStatusElement.textContent =
            `${settings.label}・${Math.ceil(descentTimer)} 秒後下降`;
        } else {
          challengeStatusElement.textContent = settings.label;
        }
      }

      function randomColor() {
        const colorCount = gameMode === 'campaign' || gameMode === 'falling'
          ? Math.min(colors.length, 3 + Math.floor((currentLevel - 1) / 10))
          : colors.length;
        return Math.floor(Math.random() * colorCount);
      }

      function getDescentInterval() {
        return gameMode === 'falling'
          ? Math.max(3, modeSettings.falling.interval - Math.floor((currentLevel - 1) / 10))
          : modeSettings.descent.interval;
      }

      function startLevel() {
        remainingTime = modeSettings.timed.seconds;
        shotsRemaining = modeSettings.shots.shots;
        descentTimer = getDescentInterval();
        gameStarted = false;
        gameOverReason = '';
        lastDisplayedTime = remainingTime;
        lastDisplayedDescent = descentTimer;
        dropsThisLevel = 0;
        rowParity = 0;
        pendingShot = null;
        touchAiming = false;
        board = [];
        const rowCount = gameMode === 'campaign' || gameMode === 'falling'
          ? Math.min(7, 4 + Math.floor((currentLevel - 1) / 10))
          : initialRows;
        for (let row = 0; row < rowCount; row += 1) {
          board[row] = [];
          const count = isShiftedRow(row) ? columns - 1 : columns;
          for (let column = 0; column < count; column += 1) {
            board[row][column] = randomColor();
          }
        }
        currentColor = randomColor();
        nextColor = randomColor();
        projectile = null;
        boardDropAnimation = null;
        fallingBubbles = [];
        gameOver = false;
        hasWon = false;
        paused = false;
        pauseButton.textContent = 'Ⅱ 暫停';
        pauseButton.setAttribute('aria-pressed', 'false');
        roundLabelElement.textContent = gameMode === 'campaign' || gameMode === 'falling'
          ? `關卡 ${String(currentLevel).padStart(2, '0')} / 50`
          : 'ROUND 01';
        scoreNoteElement.textContent = gameMode === 'falling'
          ? '連成 3 顆同色，泡泡一起掉落'
          : '讓相同顏色連成一片';
        scoreElement.textContent = String(score).padStart(4, '0');
        bestScoreElement.textContent = String(bestScore).padStart(4, '0');
        nextColorElement.style.color = colors[nextColor].fill;
        updateChallengeStatus();
        draw();
      }

      function resetGame() {
        window.clearTimeout(levelAdvanceTimer);
        levelAdvanceTimer = null;
        gameMode = modeSelect.value;
        columns = gameMode === 'falling' ? 14 : 10;
        currentLevel = 1;
        score = 0;
        resizeCanvas();
        startLevel();
      }

      function drawBubble(x, y, colorIndex, bubbleRadius = radius) {
        const bubble = colors[colorIndex];
        const gradient = context.createRadialGradient(
          x - bubbleRadius * 0.34,
          y - bubbleRadius * 0.4,
          bubbleRadius * 0.08,
          x,
          y,
          bubbleRadius,
        );
        gradient.addColorStop(0, bubble.light);
        gradient.addColorStop(0.46, bubble.fill);
        gradient.addColorStop(1, '#32634e');

        context.beginPath();
        context.arc(x, y, bubbleRadius * 0.94, 0, Math.PI * 2);
        context.fillStyle = gradient;
        context.fill();
        context.lineWidth = Math.max(1, bubbleRadius * 0.07);
        context.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        context.stroke();
      }

      function syncHud() {
        if (hudScore.textContent !== scoreElement.textContent) hudScore.textContent = scoreElement.textContent;
        if (hudBest.textContent !== bestScoreElement.textContent) hudBest.textContent = bestScoreElement.textContent;
        if (hudStatus.textContent !== challengeStatusElement.textContent) hudStatus.textContent = challengeStatusElement.textContent;
        if (hudNext.style.color !== nextColorElement.style.color) hudNext.style.color = nextColorElement.style.color;
      }

      function shooterPosition() {
        return { x: width / 2, y: height - radius * 1.4 };
      }

      function flightStep() {
        return radius * 0.5;
      }

      // 泡泡往前走一小步：撞到左右牆反彈；回傳有沒有反彈、有沒有碰到泡泡或天花板。
      // 瞄準線和真正發射都用這一個，所以預測的落點跟實際落點一模一樣。
      function stepFlight(state) {
        const step = flightStep();
        state.x += state.ux * step;
        state.y += state.uy * step;
        let bounced = false;
        if (state.x < radius) {
          state.x = radius;
          state.ux = Math.abs(state.ux);
          bounced = true;
        } else if (state.x > width - radius) {
          state.x = width - radius;
          state.ux = -Math.abs(state.ux);
          bounced = true;
        }
        return { bounced, hit: state.y <= radius || touchesBubble(state.x, state.y) };
      }

      // 算出泡泡會走的路線：撞到左右牆反彈，碰到泡泡或天花板就停
      function aimPath(shooter, dx, dy) {
        const length = Math.hypot(dx, dy) || 1;
        const state = { x: shooter.x, y: shooter.y, ux: dx / length, uy: dy / length };
        const points = [{ x: state.x, y: state.y }];
        for (let i = 0; i < 4000; i += 1) {
          const result = stepFlight(state);
          if (result.bounced) points.push({ x: state.x, y: state.y });
          if (result.hit) break;
        }
        points.push({ x: state.x, y: state.y });
        return points;
      }

      function touchesBubble(x, y) {
        for (let row = 0; row < board.length; row += 1) {
          if (!board[row]) continue;
          for (let column = 0; column < columns; column += 1) {
            if (board[row][column] === undefined) continue;
            const center = bubbleCenter(row, column);
            if (Math.hypot(center.x - x, center.y - y) < radius * 1.9) return true;
          }
        }
        return false;
      }

      function draw() {
        syncHud();
        if (!width || !height) return;
        context.clearRect(0, 0, width, height);
        context.fillStyle = getComputedStyle(document.documentElement)
          .getPropertyValue('--garden-color').trim();
        context.fillRect(0, 0, width, height);
        const gardenGradient = context.createLinearGradient(0, 0, 0, height);
        gardenGradient.addColorStop(0, 'rgba(190, 220, 160, 0.12)');
        gardenGradient.addColorStop(0.58, 'rgba(20, 50, 35, 0.04)');
        gardenGradient.addColorStop(1, 'rgba(5, 20, 15, 0.28)');
        context.fillStyle = gardenGradient;
        context.fillRect(0, 0, width, height);

        context.save();
        context.strokeStyle = 'rgba(209, 230, 166, 0.08)';
        context.lineWidth = 1;
        for (let lineY = radius * 2; lineY < height; lineY += radius * 1.6) {
          context.beginPath();
          context.moveTo(0, lineY);
          context.lineTo(width, lineY);
          context.stroke();
        }
        context.restore();

        const dangerY = height - radius * 4.2;
        context.save();
        context.setLineDash([7, 8]);
        context.strokeStyle = 'rgba(255, 255, 255, 0.16)';
        context.beginPath();
        context.moveTo(0, dangerY);
        context.lineTo(width, dangerY);
        context.stroke();
        context.restore();

        const dropAnimation = boardDropAnimation;
        const dropProgress = dropAnimation
          ? Math.min((performance.now() - dropAnimation.startedAt) / 520, 1)
          : 1;
        const easedDropProgress = 1 - (1 - dropProgress) ** 3;
        const dropOffset = dropAnimation ? -rowGap * (1 - easedDropProgress) : 0;
        board.forEach((row, rowIndex) => {
          if (!row) return;
          row.forEach((colorIndex, column) => {
            if (colorIndex === undefined) return;
            const center = bubbleCenter(rowIndex, column);
            drawBubble(center.x, center.y + (rowIndex >= (dropAnimation?.firstRow ?? Infinity) ? dropOffset : 0), colorIndex);
          });
        });
        if (dropAnimation && dropProgress >= 1) boardDropAnimation = null;
        const now = performance.now();
        fallingBubbles = fallingBubbles.filter((bubble) => {
          const progress = (now - bubble.startedAt) / 480;
          if (progress >= 1) return false;
          context.save();
          context.globalAlpha = 1 - progress;
          drawBubble(bubble.x, bubble.y + rowGap * 2.2 * progress, bubble.color);
          context.restore();
          return true;
        });

        const shooter = shooterPosition();
        if (!gameOver && !projectile && !paused) {
          const dx = aim.x - shooter.x;
          const dy = aim.y - shooter.y;
          const canShoot = dy < -radius * 0.4;
          context.save();
          context.setLineDash([5, 6]);
          context.lineWidth = 2;
          if (touchAiming) {
            context.strokeStyle = canShoot ? 'rgba(255, 255, 255, 0.75)' : 'rgba(255, 120, 120, 0.6)';
            const path = canShoot ? aimPath(shooter, dx, dy) : [shooter, { x: aim.x, y: aim.y }];
            context.beginPath();
            context.moveTo(path[0].x, path[0].y);
            path.slice(1).forEach((point) => context.lineTo(point.x, point.y));
            context.stroke();
          } else {
            const length = Math.hypot(dx, dy) || 1;
            context.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            context.beginPath();
            context.moveTo(shooter.x, shooter.y);
            context.lineTo(shooter.x + (dx / length) * radius * 5, shooter.y + (dy / length) * radius * 5);
            context.stroke();
          }
          context.restore();
        }

        drawBubble(shooter.x, shooter.y, currentColor, radius * 1.12);
        // 下一顆放在發射台旁邊（原本放在下面，手機上會被切掉）
        drawBubble(shooter.x + radius * 2.6, shooter.y + radius * 0.4, nextColor, radius * 0.6);
        if (projectile) {
          drawBubble(projectile.x, projectile.y, projectile.color);
        }

        if (gameOver) {
          context.fillStyle = 'rgba(8, 24, 18, 0.76)';
          context.fillRect(0, 0, width, height);
          context.textAlign = 'center';
          context.fillStyle = '#fff2ac';
          context.font = `700 ${Math.max(25, radius * 1.7)}px "Segoe UI", sans-serif`;
          const title = hasWon
            ? gameMode === 'campaign' || gameMode === 'falling'
              ? currentLevel === maxLevels ? '闖關完成！' : `第 ${currentLevel} 關完成！`
              : '太厲害了！'
            : gameOverReason || '遊戲結束';
          context.fillText(title, width / 2, height / 2 - 12);
          context.fillStyle = '#f7f5ff';
          context.font = `500 ${Math.max(15, radius * 0.9)}px "Segoe UI", sans-serif`;
          const message = (gameMode === 'campaign' || gameMode === 'falling') && hasWon && currentLevel < maxLevels
            ? `下一關即將開始・第 ${currentLevel + 1} / ${maxLevels} 關`
            : `分數：${score}　點「重新開始」再玩一次`;
          context.fillText(message, width / 2, height / 2 + 25);
        } else if (paused) {
          context.fillStyle = 'rgba(8, 24, 18, 0.76)';
          context.fillRect(0, 0, width, height);
          context.textAlign = 'center';
          context.fillStyle = '#fff2ac';
          context.font = `700 ${Math.max(25, radius * 1.7)}px "Segoe UI", sans-serif`;
          context.fillText('遊戲暫停', width / 2, height / 2);
          context.fillStyle = '#f7f5ff';
          context.font = `500 ${Math.max(15, radius * 0.9)}px "Segoe UI", sans-serif`;
          context.fillText('按「繼續」回到遊戲', width / 2, height / 2 + 34);
        }
      }

      function findCluster(startRow, startColumn, colorIndex) {
        const cluster = [];
        const visited = new Set();
        const pending = [[startRow, startColumn]];

        while (pending.length) {
          const [row, column] = pending.pop();
          const key = `${row},${column}`;
          if (visited.has(key) || board[row]?.[column] !== colorIndex) continue;
          visited.add(key);
          cluster.push([row, column]);
          neighbors(row, column).forEach(([nextRow, nextColumn]) => {
            if (nextRow >= 0 && nextColumn >= 0 && nextColumn < columns) {
              pending.push([nextRow, nextColumn]);
            }
          });
        }
        return cluster;
      }

      function removeFloatingBubbles() {
        const connected = new Set();
        const pending = [];

        const firstOccupiedRow = gameMode === 'falling'
          ? board.findIndex((row) => row?.some((colorIndex) => colorIndex !== undefined))
          : 0;
        board[firstOccupiedRow]?.forEach((colorIndex, column) => {
          if (colorIndex !== undefined) pending.push([firstOccupiedRow, column]);
        });

        while (pending.length) {
          const [row, column] = pending.pop();
          const key = `${row},${column}`;
          if (connected.has(key) || board[row]?.[column] === undefined) continue;
          connected.add(key);
          neighbors(row, column).forEach(([nextRow, nextColumn]) => {
            if (nextRow >= 0 && nextColumn >= 0 && nextColumn < columns) {
              pending.push([nextRow, nextColumn]);
            }
          });
        }

        let removed = 0;
        board.forEach((row, rowIndex) => {
          row?.forEach((colorIndex, column) => {
            if (colorIndex !== undefined && !connected.has(`${rowIndex},${column}`)) {
              if (gameMode === 'falling') {
                const center = bubbleCenter(rowIndex, column);
                fallingBubbles.push({
                  x: center.x,
                  y: center.y,
                  color: colorIndex,
                  startedAt: performance.now(),
                });
              }
              row[column] = undefined;
              removed += 1;
            }
          });
        });
        return removed;
      }

      function dropField() {
        if (gameMode === 'falling' && dropsThisLevel >= maxDropsPerLevel) {
          updateChallengeStatus();
          return;
        }
        const topRow = [];
        // 新的一排插在最上面：所有排的編號 +1，奇偶跟著換，原本的泡泡位置才不會跳
        rowParity ^= 1;
        const count = isShiftedRow(0) ? columns - 1 : columns;
        for (let column = 0; column < count; column += 1) {
          topRow[column] = randomColor();
        }
        board.unshift(topRow);
        if (gameMode === 'falling') dropsThisLevel += 1;
        boardDropAnimation = { startedAt: performance.now(), firstRow: 1 };
        descentTimer = getDescentInterval();
        lastDisplayedDescent = Math.ceil(descentTimer);
        updateChallengeStatus();
        checkGameOver();
      }

      function finishTurn(row, column, colorIndex) {
        if (!board[row]) board[row] = [];
        board[row][column] = colorIndex;
        let clearedCount = 0;
        let floatingCount = 0;
        let shouldScoreClear = false;
        const cluster = findCluster(row, column, colorIndex);
        if (cluster.length >= 3) {
          const startedAt = performance.now();
          if (gameMode === 'falling') {
            cluster.forEach(([bubbleRow, bubbleColumn]) => {
              const center = bubbleCenter(bubbleRow, bubbleColumn);
              fallingBubbles.push({
                x: center.x,
                y: center.y,
                color: board[bubbleRow][bubbleColumn],
                startedAt,
              });
            });
          }
          cluster.forEach(([bubbleRow, bubbleColumn]) => {
            board[bubbleRow][bubbleColumn] = undefined;
          });
          clearedCount = cluster.length;
          floatingCount = removeFloatingBubbles();
          shouldScoreClear = true;
        }

        if (shouldScoreClear) {
          score += clearedCount * 10 + floatingCount * 5;
          scoreElement.textContent = String(score).padStart(4, '0');
          if (score > bestScore) {
            bestScore = score;
            saveBest();
          }
          bestScoreElement.textContent = String(bestScore).padStart(4, '0');
          playTone(880, 0.12, 0.07);
          window.setTimeout(() => playTone(1174.66, 0.18, 0.055), 90);
        } else {
          playTone(330, 0.08, 0.025, 'triangle');
        }

        projectile = null;
        currentColor = nextColor;
        nextColor = randomColor();
        nextColorElement.style.color = colors[nextColor].fill;

        if (!board.some((rowBubbles) => rowBubbles?.some((bubble) => bubble !== undefined))) {
          gameOver = true;
          hasWon = true;
          gameOverReason = gameMode === 'campaign' || gameMode === 'falling'
            ? '本關完成！'
            : '花園清空！';
          stopMusic();
          playTone(1046.5, 0.25, 0.05);
          if ((gameMode === 'campaign' || gameMode === 'falling') && currentLevel < maxLevels) {
            levelAdvanceTimer = window.setTimeout(() => {
              currentLevel += 1;
              roundLabelElement.textContent = `關卡 ${String(currentLevel).padStart(2, '0')} / 50`;
              startLevel();
              if (document.hidden) setPaused(true);
              else if (musicEnabled) startMusic();
            }, 1800);
          }
        } else {
          if (gameMode === 'descent') dropField();
          if (!gameOver) checkGameOver();
          if (!gameOver && gameMode === 'shots' && shotsRemaining === 0) {
            gameOver = true;
            gameOverReason = '泡泡用完！';
            stopMusic();
          }
        }
        updateChallengeStatus();
        draw();
      }

      function findNearestEmpty(x, y) {
        let nearest = null;
        let nearestDistance = Infinity;
        const estimatedRow = Math.max(0, Math.round((y - radius) / rowGap));

        for (let row = Math.max(0, estimatedRow - 1); row <= estimatedRow + 1; row += 1) {
          for (let column = 0; column < columns; column += 1) {
            if (board[row]?.[column] !== undefined) continue;
            const center = bubbleCenter(row, column);
            const distance = Math.hypot(center.x - x, center.y - y);
            if (distance < nearestDistance) {
              nearest = { row, column };
              nearestDistance = distance;
            }
          }
        }
        return nearest;
      }

      function checkGameOver() {
        const dangerY = height - radius * 4.2;
        const reachedBottom = board.some((row, rowIndex) =>
          row?.some((colorIndex, column) => {
            if (colorIndex === undefined) return false;
            return bubbleCenter(rowIndex, column).y + radius >= dangerY;
          }),
        );
        if (reachedBottom) {
          gameOver = true;
          gameOverReason = '泡泡碰到底線！';
          stopMusic();
          playTone(196, 0.35, 0.06, 'triangle');
        }
      }

      function shoot(targetX, targetY) {
        if (gameOver || paused) return;
        const shooter = shooterPosition();
        const dx = targetX - shooter.x;
        const dy = targetY - shooter.y;
        if (dy >= -radius * 0.4) return;
        if (projectile || boardDropAnimation) {
          pendingShot = { x: targetX, y: targetY };
          return;
        }
        gameStarted = true;
        if (gameMode === 'shots') {
          shotsRemaining -= 1;
          updateChallengeStatus();
        }
        const length = Math.hypot(dx, dy) || 1;
        const speed = Math.max(440, radius * 28);

        projectile = {
          x: shooter.x,
          y: shooter.y,
          ux: dx / length,
          uy: dy / length,
          vx: (dx / length) * speed,
          vy: (dy / length) * speed,
          speed,
          travel: 0,
          color: currentColor,
        };
        ensureAudio();
        playTone(440, 0.08, 0.025, 'triangle');
      }

      function updateProjectile(deltaTime) {
        if (!projectile) return;
        // 這一格畫面該走多遠，就一小步一小步走（跟瞄準線同一套），途中碰到就停
        projectile.travel += projectile.speed * deltaTime;
        let hit = false;
        while (projectile.travel >= flightStep()) {
          projectile.travel -= flightStep();
          const result = stepFlight(projectile);
          projectile.vx = projectile.ux * projectile.speed;
          if (result.hit) { hit = true; break; }
        }

        if (hit) {
          const spot = findNearestEmpty(projectile.x, projectile.y);
          if (spot) {
            finishTurn(spot.row, spot.column, projectile.color);
          } else {
            projectile = null;
            gameOver = true;
            gameOverReason = '沒有可放置泡泡的位置！';
            stopMusic();
          }
        }
      }

      function animate(timestamp) {
        const deltaTime = Math.min((timestamp - lastFrame) / 1000 || 0, 0.04);
        lastFrame = timestamp;
        if (paused) {
          draw();
          window.requestAnimationFrame(animate);
          return;
        }
        if (gameMode === 'timed' && gameStarted && !gameOver) {
          remainingTime = Math.max(0, remainingTime - deltaTime);
          const displayedTime = Math.ceil(remainingTime);
          if (displayedTime !== lastDisplayedTime) {
            lastDisplayedTime = displayedTime;
            updateChallengeStatus();
          }
          if (remainingTime === 0) {
            gameOver = true;
            gameOverReason = '時間到！';
            stopMusic();
          }
        }
        if ((gameMode === 'descent' || gameMode === 'falling') && gameStarted && !gameOver
          && (gameMode !== 'falling' || dropsThisLevel < maxDropsPerLevel)) {
          descentTimer -= deltaTime;
          const displayedDescent = Math.ceil(descentTimer);
          if (displayedDescent !== lastDisplayedDescent) {
            lastDisplayedDescent = displayedDescent;
            updateChallengeStatus();
          }
          if (descentTimer <= 0) dropField();
        }
        if (!gameOver) updateProjectile(deltaTime);
        if (pendingShot && !projectile && !boardDropAnimation && !gameOver) {
          const queued = pendingShot;
          pendingShot = null;
          shoot(queued.x, queued.y);
        }
        draw();
        window.requestAnimationFrame(animate);
      }

      function updateAim(event) {
        const bounds = canvas.getBoundingClientRect();
        aim = { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
      }

      function isTouchLike(event) {
        return event.pointerType === 'touch' || event.pointerType === 'pen';
      }

      canvas.addEventListener('pointermove', (event) => {
        if (isTouchLike(event) && (!touchAiming || event.pointerId !== touchPointerId)) return;
        aimSet = true;
        updateAim(event);
      });
      canvas.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        if (isTouchLike(event) && touchAiming) return;   // 第二根手指：不理它
        aimSet = true;
        updateAim(event);
        startMusic();
        if (isTouchLike(event)) {
          if (gameOver || paused) return;
          touchAiming = true;
          touchPointerId = event.pointerId;
          try { canvas.setPointerCapture(event.pointerId); } catch (error) { /* 不支援也沒關係 */ }
          return;
        }
        shoot(aim.x, aim.y);
      });
      canvas.addEventListener('pointerup', (event) => {
        if (!touchAiming || event.pointerId !== touchPointerId) return;
        updateAim(event);
        touchAiming = false;
        touchPointerId = null;
        shoot(aim.x, aim.y);   // 拖到發射台下面放開＝不發射（shoot 會自己擋掉）
      });
      canvas.addEventListener('pointercancel', (event) => {
        if (event.pointerId !== touchPointerId) return;
        touchAiming = false;
        touchPointerId = null;
      });
      // 手機切到別的 App 或關螢幕：自動暫停，音樂也停，回來按「繼續」
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) return;
        touchAiming = false;
        touchPointerId = null;
        if (!gameOver) setPaused(true);
        else stopMusic();
      });

      window.addEventListener('keydown', (event) => {
        if (event.code !== 'Space' || event.repeat) return;
        if (event.target instanceof HTMLElement && ['INPUT', 'SELECT', 'BUTTON'].includes(event.target.tagName)) return;
        event.preventDefault();
        startMusic();
        shoot(width / 2, height * 0.35);
      });

      modeSelect.addEventListener('change', () => {
        stopMusic();
        resetGame();
      });

      gardenColorInput.addEventListener('input', () => {
        const color = gardenColorInput.value.toUpperCase();
        document.documentElement.style.setProperty('--garden-color', color);
        colorValueElement.textContent = color;
        draw();
      });

      restartButton.addEventListener('click', () => {
        resetGame();
        startMusic();
      });

      pauseButton.addEventListener('click', () => {
        setPaused(!paused);
      });

      musicButton.addEventListener('click', () => {
        musicEnabled = !musicEnabled;
        setMusicButton();
        if (musicEnabled) {
          ensureAudio();
          startMusic();
        } else {
          stopMusic();
        }
      });

      // 版本號：上線時 workflow 會把 dev 換成提交代號，方便確認手機上是不是最新版
      document.getElementById('ver').textContent = document.querySelector('meta[name="app-version"]').content;
      window.addEventListener('resize', resizeCanvas);
      setMusicButton();
      resizeCanvas();
      resetGame();
      window.requestAnimationFrame(animate);
    </script>
  </body>
</html>
