<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123b2d" />
    <meta name="app-version" content="dev" />
    <title>泡泡花園・Bubble Garden</title>
    <link rel="stylesheet" href="style.css?v=dev" />
  </head>
  <body>
    <main class="game">
      <header class="topbar">
        <div class="brand">
          <span class="flower-mark" aria-hidden="true">🌸</span>
          <div>
            <h1>泡泡花園</h1>
            <div class="subtitle">BUBBLE GARDEN · 01</div>
          </div>
        </div>
        <div class="controls">
          <button id="musicBtn" class="control-button" type="button" aria-pressed="true">♫ 音樂開</button>
          <button id="pauseBtn" class="control-button" type="button" aria-pressed="false">Ⅱ 暫停</button>
          <span class="round-label" id="roundLabel">ROUND&nbsp; 01</span>
          <button id="restartBtn" class="control-button" type="button" aria-label="重新開始" title="重新開始">⟳</button>
        </div>
      </header>
      <div class="play-area">
        <div class="board-wrap">
        <div class="hud" aria-hidden="true">
          <span>分數 <strong id="hudScore">0000</strong></span>
          <span>最高 <strong id="hudBest">0000</strong></span>
          <span>下一顆 <strong class="hud-next" id="hudNext">●</strong></span>
          <span class="hud-status" id="hudStatus"></span>
        </div>
        <div class="board">
          <canvas id="gameCanvas" aria-label="泡泡花園遊戲區：電腦用滑鼠瞄準點擊發射；手機用手指按住拖曳瞄準，放開發射"></canvas>
        </div>
        </div>
        <aside class="sidebar" aria-live="polite">
          <section class="panel">
            <h2 class="panel-label">GARDEN SETTINGS</h2>
            <div class="settings-grid">
              <div>
                <label class="setting-label" for="modeSelect">關卡類型</label>
                <select class="mode-select" id="modeSelect">
                  <option value="classic">經典花園</option>
                  <option value="campaign">闖關模式・50 關</option>
                  <option value="falling">下降闖關・50 關</option>
                  <option value="timed">限時挑戰・60 秒</option>
                  <option value="shots">限球挑戰・25 顆</option>
                  <option value="descent">下降挑戰・8 秒下降</option>
                </select>
              </div>
              <div>
                <label class="setting-label" for="gardenColor">背景顏色</label>
                <div class="color-picker-row">
                  <input class="color-picker" id="gardenColor" type="color" value="#174a37" aria-label="選擇花園背景顏色" />
                  <span class="color-value" id="colorValue">#174A37</span>
                </div>
              </div>
            </div>
            <p class="challenge-status" id="challengeStatus" aria-live="polite">經典花園・無限制</p>
          </section>
          <section class="panel" id="scorePanel">
            <h2 class="panel-label">YOUR SCORE</h2>
            <div class="score-value" id="score">0000</div>
            <p class="score-note" id="scoreNote">讓相同顏色連成一片</p>
            <div class="best-score"><span>最高紀錄</span><strong id="bestScore">0000</strong></div>
          </section>
          <section class="panel" id="nextPanel">
            <h2 class="panel-label">UP NEXT</h2>
            <div class="next-bubble"><strong id="nextColor">●</strong></div>
            <p class="panel-copy">準備發射<br />下一顆泡泡</p>
          </section>
          <section class="panel">
            <h2 class="panel-label">HOW TO PLAY</h2>
            <p class="panel-copy"><span class="key">滑鼠</span>瞄準方向<br /><span class="key">點擊</span>發射泡泡<br /><span class="key">SPACE</span>快速發射<br /><span class="key">手機</span>按住拖曳瞄準，放開發射；拖到發射台下面放開＝取消</p>
          </section>
          <p class="hint">小提示：清除泡泡上方懸空的泡泡，可以拿到額外分數。<br />版本 <span id="ver">dev</span></p>
        </aside>
      </div>
    </main>

    <!-- 程式積木：順序不能亂，後面的會用到前面的；main 一定在最後 -->
    <script src="js/elements.js?v=dev"></script>
    <script src="js/config.js?v=dev"></script>
    <script src="js/state.js?v=dev"></script>
    <script src="js/sound.js?v=dev"></script>
    <script src="js/board.js?v=dev"></script>
    <script src="js/flight.js?v=dev"></script>
    <script src="js/draw.js?v=dev"></script>
    <script src="js/game.js?v=dev"></script>
    <script src="js/input.js?v=dev"></script>
    <script src="js/main.js?v=dev"></script>
  </body>
</html>
